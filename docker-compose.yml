version: '3.8'

services:
  # -------------------------------------------------------------
  # Base de Datos PostgreSQL 16 (Preconfigurada por defecto)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mil_inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mil_inventory_db}
      POSTGRES_USER: ${DB_USER:-mil_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureMilPass2026!}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - mil-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mil_admin} -d ${DB_NAME:-mil_inventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Base de Datos MySQL 8.0 (Opción alternativa lista para usar)
  # Para activarla: descomentar este servicio y cambiar DB_DIALECT=mysql en .env
  # -------------------------------------------------------------
  # mysql:
  #   image: mysql:8.0
  #   container_name: mil_inventory_mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-SecureMilPass2026!}
  #     MYSQL_DATABASE: ${DB_NAME:-mil_inventory_db}
  #     MYSQL_USER: ${DB_USER:-mil_admin}
  #     MYSQL_PASSWORD: ${DB_PASSWORD:-SecureMilPass2026!}
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - mil-net

  # -------------------------------------------------------------
  # Backend API: Node.js + Express + Sequelize ORM
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: mil_inventory_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_DIALECT: ${DB_DIALECT:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mil_inventory_db}
      DB_USER: ${DB_USER:-mil_admin}
      DB_PASSWORD: ${DB_PASSWORD:-SecureMilPass2026!}
      JWT_SECRET: ${JWT_SECRET:-TACTICAL_MIL_COMSEC_JWT_SECRET_KEY_984729184}
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mil-net
    command: npm run server:dev

  # -------------------------------------------------------------
  # Frontend Web: React + TypeScript + Tailwind CSS (Zero CDN)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: mil_inventory_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mil-net
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local

networks:
  mil-net:
    driver: bridge
    name: military_tactical_network
